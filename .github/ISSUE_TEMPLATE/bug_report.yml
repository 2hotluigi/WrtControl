name: Bug report
description: Something in the app doesn't work as it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For security problems, use the private form in SECURITY.md instead.
        Please **don't paste** MAC addresses, public IPs, passwords, keys or Wi-Fi names.
        *Puedes escribir en español.*
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: router-state
    attributes:
      label: Is your router OK now?
      description: Did the change roll back on its own? Is anything left over in LuCI (sections or rules named `wrtc…`)?
  - type: input
    id: router
    attributes:
      label: Router model and OpenWrt version
      placeholder: "GL.iNet GL-MT6000, OpenWrt 25.12.6"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: WrtControl and Android versions
      placeholder: "WrtControl 0.3.0, Android 15"
    validations:
      required: true
