# Pruebas contra OpenWrt de verdad (VmIntegrationTest, AddonsVmTest y DevicesVmTest) en QEMU, en cada versión
# soportada. Cada noche, en los PR que tocan el control parental, los paquetes o estas pruebas, y a mano.
name: OpenWrt

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/src/main/java/dev/angel/wrtcontrol/parental/**'
      - 'app/src/main/java/dev/angel/wrtcontrol/addons/**'
      - 'app/src/main/java/dev/angel/wrtcontrol/openwrt/**'
      - 'app/src/main/java/dev/angel/wrtcontrol/ubus/**'
      - 'app/src/test/java/**/*VmTest.kt'
      - 'app/src/test/java/**/VmIntegrationTest.kt'
      - 'tools/vm/**'
      - '.github/workflows/vm.yml'

concurrency:
  group: vm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vm:
    name: openwrt-${{ matrix.openwrt }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        openwrt: ['24.10', '25.12', snapshot]
    # snapshot cambia cada día: avisa, pero no tumba la ejecución.
    continue-on-error: ${{ matrix.openwrt == 'snapshot' }}
    env:
      WRTCONTROL_VM: 192.168.56.2
      WRTCONTROL_SSH_OPTS: -i ${{ github.workspace }}/vm/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=10
      # Los runners de GitHub no dejan salir ICMP a internet: el ping de las pruebas va al PC, al otro
      # lado de la WAN (QEMU lo responde), así que sigue pasando por el forward del router.
      WRTCONTROL_PING_TARGET: 10.0.3.2
      # "Una conexión nueva funciona": un servidor HTTP en el PC (paso "Servidor HTTP en el PC").
      WRTCONTROL_HTTP_TARGET: http://10.0.3.2:8080/
    steps:
      - uses: actions/checkout@v7

      - name: KVM y dependencias
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends qemu-system-x86 zstd gawk rsync libncurses-dev

      - name: Versión de OpenWrt ${{ matrix.openwrt }}
        id: ib
        run: |
          info=$(sh tools/vm/openwrt-qemu.sh ibinfo '${{ matrix.openwrt }}')
          echo "$info"
          echo "sha=$(echo "$info" | cut -d' ' -f3)" >> "$GITHUB_OUTPUT"

      # El Image Builder pesa cientos de MB y downloads.openwrt.org a veces corta: se guarda por su sha256.
      - uses: actions/cache@v6
        with:
          path: vm-cache
          key: openwrt-ib-${{ steps.ib.outputs.sha }}

      - name: Imagen de OpenWrt ${{ matrix.openwrt }}
        env:
          WRTC_IB_CACHE: ${{ github.workspace }}/vm-cache
        run: |
          mkdir -p vm
          ssh-keygen -q -t ed25519 -N '' -f vm/id_ed25519
          sh tools/vm/openwrt-qemu.sh build '${{ matrix.openwrt }}' vm vm/id_ed25519.pub
          echo "Versión: $(cat vm/version)" >> "$GITHUB_STEP_SUMMARY"

      - name: Arrancar el router
        run: sh tools/vm/openwrt-qemu.sh up vm/openwrt.img

      - name: Internet en el router
        run: |
          vm() { ssh $WRTCONTROL_SSH_OPTS root@$WRTCONTROL_VM "$@"; }
          vm 'cat /etc/openwrt_release'
          # La WAN tarda unos segundos en tener dirección después de que la web ya responde.
          ok=''
          for i in $(seq 30); do
            vm 'wget -q -T 3 -O /dev/null https://downloads.openwrt.org/' && { ok=1; echo "Internet en $((i * 3)) s"; break; }
            sleep 3
          done
          vm "ip -br addr; ip route; nslookup openwrt.org 2>&1 | tail -3; ping -c 2 -W 2 $WRTCONTROL_PING_TARGET" || true
          [ -n "$ok" ] || { vm 'wget -T 5 -O /dev/null https://downloads.openwrt.org/'; exit 1; }

      - name: Servidor HTTP en el PC
        run: |
          mkdir -p /tmp/wrtc-http && echo ok > /tmp/wrtc-http/index.html
          nohup python3 -m http.server 8080 --directory /tmp/wrtc-http > /tmp/wrtc-http.log 2>&1 &
          sleep 1
          ssh $WRTCONTROL_SSH_OPTS root@$WRTCONTROL_VM "wget -q -O - $WRTCONTROL_HTTP_TARGET"

      - name: Cliente de pruebas en el router
        run: |
          ssh $WRTCONTROL_SSH_OPTS root@$WRTCONTROL_VM "cat > /tmp/netns-client.sh && PING_TARGET=$WRTCONTROL_PING_TARGET sh /tmp/netns-client.sh up" < tools/vm/netns-client.sh
          ssh $WRTCONTROL_SSH_OPTS root@$WRTCONTROL_VM '/usr/libexec/ip-full netns list' | grep -q wrtc_client

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Las tres versiones usan las mismas dependencias: solo una guarda caché (en master, como
      # siempre) y las otras la leen. Así no ocupan tres entradas del límite de 10 GB del repositorio.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' || matrix.openwrt != '25.12' }}

      - name: VmIntegrationTest, AddonsVmTest y DevicesVmTest
        run: ./gradlew :app:testDebugUnitTest --tests '*VmIntegrationTest*' --tests '*VmTest*' --rerun

      - name: Registro del router
        if: always()
        run: |
          ssh $WRTCONTROL_SSH_OPTS root@$WRTCONTROL_VM 'logread' > vm/logread.txt 2>&1 || true
          cp /tmp/wrtc-qemu/console.log vm/ 2>/dev/null || true
          sh tools/vm/openwrt-qemu.sh down

      - name: Informes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openwrt-${{ matrix.openwrt }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            vm/logread.txt
            vm/console.log
            vm/version
          if-no-files-found: ignore

  # La guía de inicio rápido: tools/vm/demo.sh con la imagen oficial, sin sudo, como la usaría alguien
  # sin router. La app entra con la contraseña que le pone el script; se apaga (SIGTERM, lo mismo que
  # Ctrl+C) y vuelve a arrancar con lo guardado.
  demo:
    name: demo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WRTC_DEMO_DIR: ${{ github.workspace }}/demo
      WRTCONTROL_DEMO: 127.0.0.1:8080
    steps:
      - uses: actions/checkout@v7

      - name: KVM y QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends qemu-system-x86

      - name: Router de prueba
        run: |
          start() {
            sh tools/vm/demo.sh --local > demo.log 2>&1 &
            echo $! > demo.pid
            for i in $(seq 150); do grep -q 'Router de prueba listo' demo.log && break; sleep 2; done
            cat demo.log
            grep -q 'Router de prueba listo' demo.log
          }
          start
          echo "WRTCONTROL_DEMO_PASSWORD=$(cat demo/password)" >> "$GITHUB_ENV"
          # Como Ctrl+C (un script en segundo plano no recibe SIGINT): apaga el router y termina.
          kill -TERM "$(cat demo.pid)"
          for i in $(seq 30); do kill -0 "$(cat demo.pid)" 2>/dev/null || break; sleep 1; done
          ! kill -0 "$(cat demo.pid)" 2>/dev/null
          grep -q 'Apagando' demo.log
          # Segundo arranque: ya con contraseña, sin el primer paso.
          start
          ! grep -q 'Primer arranque' demo.log

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: DemoRouterTest
        run: ./gradlew :app:testDebugUnitTest --tests '*DemoRouterTest*' --rerun

      - name: Informes
        if: always()
        run: |
          kill -TERM "$(cat demo.pid)" 2>/dev/null || true
          cp demo.log demo/console.log app/build/ 2>/dev/null || true

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/demo.log
            app/build/console.log
          if-no-files-found: ignore