# Se ejecuta en cada PR y en cada push a master. Para que no se pueda fusionar en rojo, en GitHub:
# Settings → Branches → master → "Require status checks to pass" con los trabajos "android" y "tunnel".
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # El mismo que pide gradle/gradle-daemon-jvm.properties: así no lo descarga en cada ejecución.
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # Robolectric descarga en plena prueba su android-all (unos 150 MB) de Maven Central a ~/.m2,
      # fuera de la caché de Gradle: sin esto, cada ejecución lo pide y a veces responde "429 Too
      # Many Requests". Cambia con la versión de Robolectric (libs.versions.toml).
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-

      - name: Pruebas unitarias
        # Las pruebas unitarias y, con ellas, la comparación de las capturas (Roborazzi).
        run: ./gradlew :app:verifyRoborazziDebug

      - name: detekt + ktlint
        run: ./gradlew :app:detekt

      - name: Android lint
        run: ./gradlew :app:lintDebug

      - name: Cobertura (kover)
        run: ./gradlew :app:koverXmlReportDebug :app:koverHtmlReportDebug

      - name: Informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  # Las reglas que genera la app, con el nftables y el fw4 de cada versión de OpenWrt (imágenes
  # oficiales openwrt/rootfs). Así un cambio que no analiza en una versión falla aquí, no en un router.
  # Los ejemplos se generan una vez (un solo Gradle: cinco a la vez descargando lo mismo de Maven
  # Central acababan en "429 Too Many Requests") y cada versión solo los comprueba.
  nft-samples:
    name: nft-samples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Las mismas dependencias que "android": lee su caché y no escribe una propia.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Ejemplos de reglas
        env:
          WRTCONTROL_NFT_SAMPLES: ${{ runner.temp }}/nft-samples
        run: ./gradlew :app:testDebugUnitTest --tests '*NftSamplesTest*' --rerun

      - uses: actions/upload-artifact@v4
        with:
          name: nft-samples
          path: ${{ runner.temp }}/nft-samples
          if-no-files-found: error
          retention-days: 1

  nft:
    name: nft-${{ matrix.openwrt }}
    needs: nft-samples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        openwrt: ['22.03.7', '23.05.6', '24.10.8', '25.12.6', SNAPSHOT]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nft-samples
          path: ${{ runner.temp }}/nft-samples

      - name: nft -c y fw4 check en OpenWrt ${{ matrix.openwrt }}
        run: |
          docker run --rm --cap-add NET_ADMIN -v "$PWD/tools:/tools:ro" \
            -v "${{ runner.temp }}/nft-samples:/samples:ro" \
            "openwrt/rootfs:x86-64-${{ matrix.openwrt }}" /bin/sh /tools/nft-check.sh

  # El .aar del túnel que va en el repositorio tiene que ser el que sale de tunnel/ con las
  # versiones fijadas en tools/build-tunnel.sh. Si no coincide, deja el suyo como artefacto
  # (wrtcvpn-aar) para traerlo con tools/fetch-tunnel-aar.sh.
  tunnel-aar:
    name: tunnel-aar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tunnel/go.mod
          cache-dependency-path: tunnel/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: NDK
        run: |
          ndk=$(sed -n 's/^NDK_VERSION=//p' tools/build-tunnel.sh)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null

      - name: Compilar el .aar
        env:
          WRTC_AAR_OUT: ${{ runner.temp }}/aar/wrtcvpn.aar
        run: sh tools/build-tunnel.sh

      - name: ¿Coincide con el del repositorio?
        run: |
          python3 -I tools/compare-aar.py app/libs/wrtcvpn.aar "$RUNNER_TEMP/aar/wrtcvpn.aar"
          python3 -I tools/compare-aar.py app/libs/wrtcvpn-sources.jar "$RUNNER_TEMP/aar/wrtcvpn-sources.jar"

      - name: El .aar de la CI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrtcvpn-aar
          path: ${{ runner.temp }}/aar/
          if-no-files-found: ignore

  tunnel:
    name: tunnel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tunnel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tunnel/go.mod
          cache-dependency-path: tunnel/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...
