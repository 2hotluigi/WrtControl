[versions]
agp = "9.5.1"
kotlin = "2.4.21"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
lifecycle = "2.11.0"
datastore = "1.3.0"
coroutines = "1.11.0"
serialization = "1.12.0"
okhttp = "5.5.1"
zxing = "3.5.4"
junit = "4.13.2"
biometric = "1.1.0"
# biometric trae fragment 1.2.5, que no admite los lanzadores de resultados de Compose (permisos).
fragment = "1.8.9"
detekt = "2.0.0-alpha.6"
kover = "0.9.11"
roborazzi = "1.79.0"
robolectric = "4.18"
# Librerías que AGP, Kover y lint traen al build con versiones vulnerables (alertas de Dependabot).
# Solo se usan al compilar y ninguna va en el APK. Se fuerzan hacia arriba en build.gradle.kts y
# app/build.gradle.kts; quitarlas cuando el plugin que las trae ya pida una versión igual o mayor.
buildGuava = "33.8.0-jre"
buildFreemarker = "2.3.35"
buildBouncycastle = "1.87"
buildJose4j = "0.9.7"
buildJdom2 = "2.0.6.1"
buildCommonsLang3 = "3.22.0"
buildHttpclient = "4.5.14"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-fragment = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
detekt-ktlint = { group = "dev.detekt", name = "detekt-rules-ktlint-wrapper", version.ref = "detekt" }
build-guava = { group = "com.google.guava", name = "guava", version.ref = "buildGuava" }
build-freemarker = { group = "org.freemarker", name = "freemarker", version.ref = "buildFreemarker" }
build-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "buildBouncycastle" }
build-bcpkix = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version.ref = "buildBouncycastle" }
build-bcutil = { group = "org.bouncycastle", name = "bcutil-jdk18on", version.ref = "buildBouncycastle" }
build-jose4j = { group = "org.bitbucket.b_c", name = "jose4j", version.ref = "buildJose4j" }
build-jdom2 = { group = "org.jdom", name = "jdom2", version.ref = "buildJdom2" }
build-commons-lang3 = { group = "org.apache.commons", name = "commons-lang3", version.ref = "buildCommonsLang3" }
build-httpclient = { group = "org.apache.httpcomponents", name = "httpclient", version.ref = "buildHttpclient" }

[bundles]
build-seguras = ["build-guava", "build-freemarker", "build-bcprov", "build-bcpkix", "build-bcutil", "build-jose4j", "build-jdom2", "build-commons-lang3", "build-httpclient"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
